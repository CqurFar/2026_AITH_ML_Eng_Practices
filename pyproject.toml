[project]
name = "humpback-whale-identification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.7.4",
    "pillow>=11",
    "polars>=1.0",
    "six>=1.17.0",
    "torch>=2.5",
    "tqdm>=4.67",
    "torchvision>=0.20",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.11"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

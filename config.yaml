
audit:
  data_dir: data/raw/humpback-whale-identification
  processed_dir: data/processed/humpback-whale-identification
  seed: 42
  n_folds: 3

eda:
  data_dir: data/raw/humpback-whale-identification
  eda_dir: artifacts/hw1-baseline/eda/info
  figures_dir: artifacts/hw1-baseline/eda/plots
  duplicate_distance: 3
  seed: 42

preprocessing:
  data_dir: data/raw/humpback-whale-identification
  train_dir: data/processed/humpback-whale-identification/train
  target_height: 256
  target_width: 512
  interpolation: bilinear
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  seed: 42

training:
  data_dir: data/raw/humpback-whale-identification
  processed_dir: data/processed/humpback-whale-identification
  artifacts_dir: artifacts/hw1-baseline
  seed: 42
  n_folds: 3
  epochs: 5
  batch_size: 64
  num_workers: 8
  head_lr: 0.001
  backbone_lr: 0.0002
  weight_decay: 0.0001
  label_smoothing: 0.05
  grad_clip: 5.0
  dropout: 0.2
  unfrozen_blocks: 3
  pretrained: true
  pin_memory: true
  prefetch_factor: 4
  augment_on_device: true
